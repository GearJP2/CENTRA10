apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-proxy
  namespace: centra10
data:
  nginx.conf: "events {}\nhttp {\n  server {\n    listen 8000;\n    client_max_body_size\
    \ 8m;\n    location / {\n      proxy_pass http://vllm:8000;\n      proxy_http_version\
    \ 1.1;\n      proxy_set_header Connection close;\n      proxy_buffering off;\n\
    \      proxy_read_timeout 3600s;\n    }\n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-proxy
  namespace: centra10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-proxy
  template:
    metadata:
      labels:
        app: vllm-proxy
    spec:
      nodeSelector: {}
      containers:
      - name: proxy
        image: nginx:1.28-alpine
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 8000
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: vllm-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-proxy
  namespace: centra10
spec:
  selector:
    app: vllm-proxy
  ports:
  - name: http
    port: 8000
    targetPort: 8000

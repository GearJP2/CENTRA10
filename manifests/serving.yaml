apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: centra10
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L4
      containers:
      - name: vllm
        image: vllm/vllm-openai:vSET_INSTALLED_VERSION
        args:
        - --model
        - Qwen/Qwen2.5-7B-Instruct
        - --revision
        - SET_HUGGINGFACE_COMMIT
        - --max-model-len
        - '8192'
        - --no-enable-prefix-caching
        env:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_OFFLINE
          value: '1'
        ports:
        - name: http
          containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
        volumeMounts:
        - name: models
          mountPath: /models
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: model-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: centra10
  labels:
    app: vllm
spec:
  selector:
    app: vllm
  ports:
  - name: http
    port: 8000
    targetPort: http
